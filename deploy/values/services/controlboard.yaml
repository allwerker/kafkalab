# Controlboard (T207/T210). Release: deploy/helmfile.d/70-controlboard.yaml.gotmpl.
tier: control
memory: 128Mi
cpu: 100m
database: true          # alert history in schema/role "controlboard"
serviceAccount: controlboard
ingress:
