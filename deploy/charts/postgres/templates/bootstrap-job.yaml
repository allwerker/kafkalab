{{- /*
Idempotent bootstrap: one role + schema per service (role owns its schema, search_path pinned).
Runs after every install/upgrade so new services and rotated passwords are applied to a live database.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-bootstrap
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
    set -eu
    export PGHOST=postgres PGUSER=postgres PGDATABASE={{ .Values.database }}
    for i in $(seq 1 120); do
      pg_isready -q && break
      echo "waiting for postgres ($i)"; sleep 2
    done
    for svc in {{ join " " .Values.services }}; do
      pw="$(cat "/credentials/$svc")"
      psql -v ON_ERROR_STOP=1 -q -v svc="$svc" -v pw="$pw" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN', :'svc')
     WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'svc') \gexec
    ALTER ROLE :"svc" WITH LOGIN PASSWORD :'pw';
    CREATE SCHEMA IF NOT EXISTS :"svc" AUTHORIZATION :"svc";
    ALTER SCHEMA :"svc" OWNER TO :"svc";
    ALTER ROLE :"svc" IN DATABASE {{ .Values.database }} SET search_path = :"svc";
    GRANT CONNECT ON DATABASE {{ .Values.database }} TO :"svc";
    SQL
      echo "role/schema $svc ok"
    done
    psql -v ON_ERROR_STOP=1 -q -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bootstrap
        lab.kafka/tier: platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.image }}
          command: [sh, /scripts/bootstrap.sh]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: postgres }
          resources:
            requests: { memory: 32Mi, cpu: 10m }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
            - { name: credentials, mountPath: /credentials, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: postgres-bootstrap }
        - name: credentials
          secret: { secretName: postgres-credentials }
