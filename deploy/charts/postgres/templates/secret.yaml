{{- $creds := include "postgres.credentials" . | fromYaml }}
{{- range $ns := .Values.secretNamespaces }}
{{- /* Namespaces come from deploy/namespaces.yaml (applied by `make deploy` first). A chart must
     never own a namespace: dropping it from a later render would delete everything inside. */}}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "postgres.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $creds | nindent 2 }}
{{- end }}
