{{- $creds := include "postgres.credentials" . | fromYaml }}
{{- range $ns := .Values.secretNamespaces }}
{{- if ne $ns $.Release.Namespace }}
{{- /* Create the namespace unless somebody else (another release, kubectl) already owns it. */}}
{{- $existingNs := lookup "v1" "Namespace" "" $ns }}
{{- if or (not $existingNs) (eq (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existingNs) $.Release.Name) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "postgres.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $creds | nindent 2 }}
{{- end }}
