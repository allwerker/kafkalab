apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  labels:
    app.kubernetes.io/name: controlboard
    app.kubernetes.io/part-of: kafka-lab
{{- range $ns := .Values.targetNamespaces }}
---
# Allowlist of the experiment engine in {{ $ns }} (values.yaml, docs/adr/0003-broker-chaos.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controlboard
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: kafka-lab
rules: {{ toYaml (index $.Values.rules $ns | default list) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controlboard
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: kafka-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controlboard
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
