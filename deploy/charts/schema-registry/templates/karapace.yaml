apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/instance: {{ .Release.Name }}
    lab.kafka/tier: platform
spec:
  selector:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  labels:
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/instance: {{ .Release.Name }}
    lab.kafka/tier: platform
spec:
  replicas: 1
  strategy:
    type: Recreate   # single master; avoid two registries electing at once
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/instance: {{ .Release.Name }}
        lab.kafka/tier: platform
    spec:
      containers:
        - name: karapace
          image: {{ .Values.image }}
          command: [python3, -m, karapace]
          env:
            # Karapace config keys map to KARAPACE_<KEY> (pydantic settings, prefix "karapace_").
            - { name: KARAPACE_KARAPACE_REGISTRY, value: "true" }
            - { name: KARAPACE_KARAPACE_REST, value: "false" }
            - { name: KARAPACE_HOST, value: "0.0.0.0" }
            - { name: KARAPACE_PORT, value: "8081" }
            - name: KARAPACE_ADVERTISED_HOSTNAME
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - { name: KARAPACE_ADVERTISED_PORT, value: "8081" }
            - { name: KARAPACE_BOOTSTRAP_URI, value: {{ .Values.bootstrap | quote }} }
            - { name: KARAPACE_CLIENT_ID, value: "schema-registry" }
            - { name: KARAPACE_GROUP_ID, value: "schema-registry" }
            - { name: KARAPACE_TOPIC_NAME, value: {{ .Values.schemaTopic | quote }} }
            - { name: KARAPACE_REPLICATION_FACTOR, value: {{ .Values.kafka.defaultReplicationFactor | quote }} }
            - { name: KARAPACE_COMPATIBILITY, value: {{ .Values.compatibility | quote }} }
            - { name: KARAPACE_PRODUCER_ACKS, value: "all" }
            - { name: KARAPACE_LOG_LEVEL, value: "WARNING" }
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /_health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /_health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { memory: {{ .Values.memory }}, cpu: 50m }
            limits: { memory: {{ .Values.memory }} }
