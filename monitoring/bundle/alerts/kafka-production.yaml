# Kafka monitoring bundle — alerting and recording rules (Prometheus rule format).
# GENERATED by monitoring/dashgen (source: internal/rules/kafka.go). Do not edit: run make alerts.
# Labels: severity, component, dashboard; annotations: summary, description, runbook_url.
# Profile: production.
groups:
  - name: kafka-bundle.records
    rules:
      - record: kafka:consumer_group_topic_lag:deriv10m
        expr: deriv(kminion_kafka_consumer_group_topic_lag[10m])
      - record: kafka:consumer_group_topic_consume_rate:rate5m
        expr: rate(kminion_kafka_consumer_group_topic_offset_sum[5m])
      - record: kafka:consumer_group_topic_time_behind:seconds
        expr: kminion_kafka_consumer_group_topic_lag / clamp_min(rate(kminion_kafka_consumer_group_topic_offset_sum[5m]), 0.001)
      - record: kafka:request_handler_idle:ratio_rate5m
        expr: rate(kafka_server_kafkarequesthandlerpool_requesthandleravgidlepercent_count[5m]) / 1e9
      - record: kafka:jvm_heap_after_gc:ratio
        expr: sum by (kafka_cluster, kafka_broker, namespace, pod) (jvm_memory_pool_collection_used_bytes{kafka_broker!=""}) / sum by (kafka_cluster, kafka_broker, namespace, pod) (jvm_memory_max_bytes{kafka_broker!="",area="heap"})
      - record: kafka:jvm_gc_pause:ratio_rate5m
        expr: sum by (kafka_cluster, kafka_broker, namespace, pod) (rate(jvm_gc_collection_seconds_sum{kafka_broker!="",gc!~".*Concurrent.*"}[5m]))
      - record: kafka:e2e_roundtrip_latency_seconds:p99_rate5m
        expr: histogram_quantile(0.99, sum by (kafka_cluster, le) (rate(kminion_end_to_end_roundtrip_latency_seconds_bucket[5m])))
  - name: kafka-bundle.brokers
    rules:
      - alert: KafkaBrokerDown
        expr: (max by (kafka_cluster, kafka_broker) (up{kafka_broker!=""}) == 0) or (max by (kafka_cluster, kafka_broker) (kafka_server_kafkaserver_brokerstate) != 3)
        for: 2m
        labels:
          component: kafka
          dashboard: kafka-overview
          severity: critical
        annotations:
          description: The metrics endpoint of broker {{ $labels.kafka_broker }} cannot be scraped or the broker reports a state other than RUNNING. Its partitions fail over to other replicas; with min.insync.replicas a second loss stops writers.
          runbook_url: docs/runbooks/KafkaBrokerDown.md
          summary: Kafka broker {{ $labels.kafka_broker }} of cluster {{ $labels.kafka_cluster }} is down or not running
      - alert: KafkaOfflinePartitions
        expr: max by (kafka_cluster) (kafka_controller_kafkacontroller_offlinepartitionscount) > 0
        for: 1m
        labels:
          component: kafka
          dashboard: kafka-overview
          severity: critical
        annotations:
          description: 'At least one partition has no leader: neither producers nor consumers can use it. Usually all replicas of the partition are on brokers that are down, or unclean leader election is disabled and only out-of-sync replicas are left.'
          runbook_url: docs/runbooks/KafkaOfflinePartitions.md
          summary: Cluster {{ $labels.kafka_cluster }} has offline partitions
      - alert: KafkaUnderMinISR
        expr: sum by (kafka_cluster) (kafka_server_replicamanager_underminisrpartitioncount) > 0
        for: 1m
        labels:
          component: kafka
          dashboard: kafka-broker
          severity: critical
        annotations:
          description: Producers with acks=all receive NOT_ENOUGH_REPLICAS for these partitions — writes fail. Find the broker(s) that are down or too slow to stay in sync.
          runbook_url: docs/runbooks/KafkaUnderMinISR.md
          summary: Partitions of cluster {{ $labels.kafka_cluster }} are below min.insync.replicas
      - alert: KafkaUnderReplicatedPartitions
        expr: sum by (kafka_cluster, kafka_broker) (kafka_server_replicamanager_underreplicatedpartitions) > 0
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-broker
          severity: warning
        annotations:
          description: Followers of partitions led by broker {{ $labels.kafka_broker }} (cluster {{ $labels.kafka_cluster }}) are not in sync for a sustained period. Redundancy is reduced; check the follower brokers' disk, network and GC.
          runbook_url: docs/runbooks/KafkaUnderReplicatedPartitions.md
          summary: Broker {{ $labels.kafka_broker }} leads under-replicated partitions
      - alert: KafkaProduceLatencyHigh
        expr: max by (kafka_cluster, kafka_broker) (kafka_network_requestmetrics_totaltimems{request="Produce",quantile="0.99"}) > 500
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-broker
          severity: warning
        annotations:
          description: 'The broker needs more than 500 ms for 1 % of produce requests. Open the request time breakdown: request queue = handler saturation, local = disk, remote = slow followers (acks=all).'
          runbook_url: docs/runbooks/KafkaProduceLatencyHigh.md
          summary: Produce p99 latency on broker {{ $labels.kafka_broker }} is above 500 ms
      - alert: KafkaFetchLatencyHigh
        expr: max by (kafka_cluster, kafka_broker, request) (kafka_network_requestmetrics_localtimems{request=~"FetchConsumer|FetchFollower",quantile="0.99"}) > 1000
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-broker
          severity: warning
        annotations:
          description: Reading data for fetch requests takes the leader more than a second (local phase; long-poll waiting is excluded). Consumers or followers read from disk instead of the page cache, or the disk is saturated.
          runbook_url: docs/runbooks/KafkaFetchLatencyHigh.md
          summary: '{{ $labels.request }} local time p99 on broker {{ $labels.kafka_broker }} is above 1 s'
      - alert: KafkaRequestHandlerSaturated
        expr: max by (kafka_cluster, kafka_broker) (kafka:request_handler_idle:ratio_rate5m) < 0.2
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-broker
          severity: warning
        annotations:
          description: Requests queue up for an I/O thread and latency grows. Add brokers, raise num.io.threads (if CPU is available) or reduce the request rate (bigger batches, fewer Metadata requests).
          runbook_url: docs/runbooks/KafkaRequestHandlerSaturated.md
          summary: Request handler threads of broker {{ $labels.kafka_broker }} are more than 80 % busy
      - alert: KafkaJMXScrapeSlow
        expr: max by (kafka_cluster, kafka_broker) (avg_over_time(jmx_scrape_duration_seconds[5m])) > 3.75
        for: 15m
        labels:
          component: platform
          dashboard: lab-monitoring
          severity: warning
        annotations:
          description: 'The JMX exporter runs inside the broker JVM; slow scrapes cost broker CPU and hold MBean server locks. Check the allowlist (docs/metrics-performance-impact.md): new per-topic or per-client beans, or an overloaded broker.'
          runbook_url: docs/runbooks/KafkaJMXScrapeSlow.md
          summary: JMX scrape of broker {{ $labels.kafka_broker }} takes more than 25 % of the 15 s scrape interval
  - name: kafka-bundle.controller
    rules:
      - alert: KafkaNoActiveController
        expr: sum by (kafka_cluster) (kafka_controller_kafkacontroller_activecontrollercount) < 1
        for: 1m
        labels:
          component: kafka
          dashboard: kafka-kraft
          severity: critical
        annotations:
          description: 'No node acts as active controller: metadata is frozen (no leader elections, no topic changes, brokers cannot register). The controller quorum has lost its majority or cannot elect a leader.'
          runbook_url: docs/runbooks/KafkaNoActiveController.md
          summary: Cluster {{ $labels.kafka_cluster }} has no active KRaft controller
      - alert: KafkaMultipleActiveControllers
        expr: sum by (kafka_cluster) (kafka_controller_kafkacontroller_activecontrollercount) > 1
        for: 2m
        labels:
          component: kafka
          dashboard: kafka-kraft
          severity: critical
        annotations:
          description: Several nodes believe they are the active controller for longer than an election takes. Usually a network partition between controller nodes; check the KRaft dashboard and controller logs.
          runbook_url: docs/runbooks/KafkaMultipleActiveControllers.md
          summary: Cluster {{ $labels.kafka_cluster }} reports more than one active controller
      - alert: KafkaControllerElectionsFlapping
        expr: max by (kafka_cluster) (delta(kafka_controller_kafkacontroller_newactivecontrollerscount[15m])) > 2
        for: 5m
        labels:
          component: kafka
          dashboard: kafka-kraft
          severity: warning
        annotations:
          description: 'Frequent controller elections pause metadata changes each time. Typical causes: GC pauses or CPU starvation on controller nodes, network flakiness, slow metadata log disks.'
          runbook_url: docs/runbooks/KafkaControllerElectionsFlapping.md
          summary: KRaft controller of cluster {{ $labels.kafka_cluster }} changed more than twice in 15 minutes
      - alert: KafkaQuorumVoterUnreachable
        expr: max by (kafka_cluster, kafka_broker) (kafka_server_raftmetrics_number_unknown_voter_connections) > 0
        for: 5m
        labels:
          component: kafka
          dashboard: kafka-kraft
          severity: warning
        annotations:
          description: 'The KRaft quorum on cluster {{ $labels.kafka_cluster }} has reduced fault tolerance: one more voter failure can stop metadata processing.'
          runbook_url: docs/runbooks/KafkaQuorumVoterUnreachable.md
          summary: Node {{ $labels.kafka_broker }} cannot reach a KRaft voter
      - alert: KafkaQuorumCommitSlow
        expr: max by (kafka_cluster, kafka_broker) (kafka_server_raftmetrics_commit_latency_avg) > 1000
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-kraft
          severity: warning
        annotations:
          description: Committing metadata records to a majority of voters is slow. Leader elections and topic changes are delayed; check the controller nodes' disks and network.
          runbook_url: docs/runbooks/KafkaQuorumCommitSlow.md
          summary: KRaft metadata commits on node {{ $labels.kafka_broker }} take more than 1 s
      - alert: KafkaBrokerMetadataLagging
        expr: max by (kafka_cluster, kafka_broker) (kafka_server_brokermetadatametrics_last_applied_record_lag_ms < 86400000) > 30000
        for: 5m
        labels:
          component: kafka
          dashboard: kafka-kraft
          severity: warning
        annotations:
          description: 'The broker lags behind the KRaft metadata log (Kafka writes a no-op record every 500 ms, so the lag is normally below a second). It serves stale leadership information: clients see NOT_LEADER errors and timeouts.'
          runbook_url: docs/runbooks/KafkaBrokerMetadataLagging.md
          summary: Broker {{ $labels.kafka_broker }} applies metadata more than 30 s late
      - alert: KafkaBrokerFenced
        expr: max by (kafka_cluster) (kafka_controller_kafkacontroller_fencedbrokercount) > 0
        for: 5m
        labels:
          component: kafka
          dashboard: kafka-kraft
          severity: warning
        annotations:
          description: The active controller fenced at least one broker because its heartbeats stopped. A fenced broker leads no partitions; if it is running, it cannot reach the controller quorum.
          runbook_url: docs/runbooks/KafkaBrokerFenced.md
          summary: Cluster {{ $labels.kafka_cluster }} has fenced brokers
  - name: kafka-bundle.consumers
    rules:
      - alert: KafkaConsumerLagGrowing
        expr: (kafka:consumer_group_topic_lag:deriv10m > 0) and on (kafka_cluster, group_id, topic_name) (kafka:consumer_group_topic_time_behind:seconds > 120)
        for: 15m
        labels:
          component: consumer
          dashboard: kafka-lag
          severity: warning
        annotations:
          description: 'The lag of group {{ $labels.group_id }} on topic {{ $labels.topic_name }} keeps growing and the group is more than 2 minutes behind. The consumers are slower than the producers: scale out (up to the partition count), speed up processing, or look for a hot partition.'
          runbook_url: docs/runbooks/KafkaConsumerLagGrowing.md
          summary: Consumer group {{ $labels.group_id }} falls behind on {{ $labels.topic_name }}
      - alert: KafkaConsumerStalled
        expr: (kminion_kafka_consumer_group_topic_lag > 0) unless on (kafka_cluster, group_id, topic_name) (kafka:consumer_group_topic_consume_rate:rate5m > 0) and on (kafka_cluster, group_id) (kminion_kafka_consumer_group_members > 0)
        for: 10m
        labels:
          component: consumer
          dashboard: kafka-lag
          severity: warning
        annotations:
          description: Group {{ $labels.group_id }} has members and lag on {{ $labels.topic_name }} but committed no progress for 5 minutes. The application is stuck (blocked handler, poison message, paused consumer) while still holding its partitions.
          runbook_url: docs/runbooks/KafkaConsumerStalled.md
          summary: Consumer group {{ $labels.group_id }} is stalled on {{ $labels.topic_name }}
      - alert: KafkaProbeFailing
        expr: sum by (kafka_cluster) (rate(kminion_end_to_end_messages_received_total[5m])) / sum by (kafka_cluster) (rate(kminion_end_to_end_messages_produced_total[5m])) < 0.9
        for: 5m
        labels:
          component: kafka
          dashboard: kafka-e2e
          severity: critical
        annotations:
          description: 'Less than 90 % of KMinion''s probe messages come back. Applications are very likely affected as well: check offline / under-min-ISR partitions and broker availability.'
          runbook_url: docs/runbooks/KafkaProbeFailing.md
          summary: End-to-end probe of cluster {{ $labels.kafka_cluster }} loses messages
      - alert: KafkaProbeSlow
        expr: kafka:e2e_roundtrip_latency_seconds:p99_rate5m > 2
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-e2e
          severity: warning
        annotations:
          description: Producing (acks=all) and consuming a probe message takes more than 2 s for 1 % of the probes. Look for slow produce requests, ISR problems and GC pauses.
          runbook_url: docs/runbooks/KafkaProbeSlow.md
          summary: End-to-end probe roundtrip p99 of cluster {{ $labels.kafka_cluster }} is above 2 s
      - alert: KMinionScrapeFailing
        expr: max by (kafka_cluster) (kminion_exporter_up) == 0
        for: 5m
        labels:
          component: platform
          dashboard: kafka-lag
          severity: warning
        annotations:
          description: 'KMinion''s last scrape of the Kafka admin API failed: lag, topic size and probe metrics are stale. Lag alerts cannot fire while this lasts.'
          runbook_url: docs/runbooks/KMinionScrapeFailing.md
          summary: KMinion cannot read cluster {{ $labels.kafka_cluster }}
  - name: kafka-bundle.jvm-and-disk
    rules:
      - alert: KafkaHeapAfterGCHigh
        expr: kafka:jvm_heap_after_gc:ratio > 0.8
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-jvm
          severity: warning
        annotations:
          description: 'Live data no longer fits comfortably into the heap of {{ $labels.pod }}: the JVM collects constantly, pauses grow and an OutOfMemoryError is near. Raise -Xmx (and the memory limit) or reduce partitions/connections per broker.'
          runbook_url: docs/runbooks/KafkaHeapAfterGCHigh.md
          summary: Broker {{ $labels.kafka_broker }} keeps more than 80 % of its heap after GC
      - alert: KafkaGCTimeHigh
        expr: kafka:jvm_gc_pause:ratio_rate5m > 0.1
        for: 10m
        labels:
          component: kafka
          dashboard: kafka-jvm
          severity: warning
        annotations:
          description: 'Stop-the-world garbage collection on {{ $labels.pod }} takes more than 10 % of wall-clock time: request latency rises, ISR shrinks and session timeouts follow. Check heap after GC and allocation rate.'
          runbook_url: docs/runbooks/KafkaGCTimeHigh.md
          summary: Broker {{ $labels.kafka_broker }} spends more than 10 % of its time in GC pauses
      - alert: KafkaDiskFillingUp
        expr: (predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0 and kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.25) * on (namespace, persistentvolumeclaim) group_left (kafka_cluster, kafka_broker, pod) (max by (namespace, persistentvolumeclaim, pod) (kube_pod_spec_volumes_persistentvolumeclaims_info) * on (namespace, pod) group_left (kafka_cluster, kafka_broker) (max by (namespace, pod, kafka_cluster, kafka_broker) (kafka_server_kafkaserver_brokerstate) * 0 + 1))
        for: 1h
        labels:
          component: kafka
          dashboard: kafka-pods
          severity: warning
        annotations:
          description: 'At the growth rate of the last 6 hours the data volume of broker {{ $labels.kafka_broker }} ({{ $labels.pod }}) runs out of space within a day. A full log dir takes the broker offline: reduce retention, add disk or rebalance partitions.'
          runbook_url: docs/runbooks/KafkaDiskFillingUp.md
          summary: Kafka volume {{ $labels.persistentvolumeclaim }} will be full within 24 h
      - alert: KafkaDiskAlmostFull
        expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.1) * on (namespace, persistentvolumeclaim) group_left (kafka_cluster, kafka_broker, pod) (max by (namespace, persistentvolumeclaim, pod) (kube_pod_spec_volumes_persistentvolumeclaims_info) * on (namespace, pod) group_left (kafka_cluster, kafka_broker) (max by (namespace, pod, kafka_cluster, kafka_broker) (kafka_server_kafkaserver_brokerstate) * 0 + 1))
        for: 5m
        labels:
          component: kafka
          dashboard: kafka-pods
          severity: critical
        annotations:
          description: Broker {{ $labels.kafka_broker }} ({{ $labels.pod }}) is about to run out of disk. When the log dir is full the broker marks it offline and its partitions become unavailable on this replica.
          runbook_url: docs/runbooks/KafkaDiskAlmostFull.md
          summary: Kafka volume {{ $labels.persistentvolumeclaim }} has less than 10 % free space
