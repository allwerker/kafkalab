# Kafka Lab — business alerts of the commerce simulation (demo only, MetricsQL allowed).
# GENERATED by monitoring/dashgen (source: internal/rules/business.go). Do not edit: run make alerts.
groups:
  - name: kafka-lab.business
    rules:
      - alert: LabPaymentFailureRateHigh
        expr: sum(rate(lab_payments_total{result="failed"}[5m])) / sum(rate(lab_payments_total[5m])) > 0.25
        for: 1m
        labels:
          component: business
          dashboard: lab-business
          severity: warning
        annotations:
          description: The share of failed payments is far above the simulated baseline (a few percent). Check the payment service, its database and the failure reasons on the Commerce Business dashboard.
          runbook_url: docs/runbooks/LabPaymentFailureRateHigh.md
          summary: More than 25 % of payments fail
      - alert: LabOrderCompletionSlow
        expr: histogram_quantile(0.95, sum by (vmrange) (rate(lab_order_completion_seconds_bucket[5m]))) > 30
        for: 1m
        labels:
          component: business
          dashboard: lab-business
          severity: warning
        annotations:
          description: Orders take much longer than usual to be shipped or cancelled. Some step of the pipeline (payment, inventory, shipping) lags — check consumer lag and the Service & Client Runtime dashboard.
          runbook_url: docs/runbooks/LabOrderCompletionSlow.md
          summary: 95 % of orders need more than 30 s from creation to completion
      - alert: LabDeadLetterActivity
        expr: sum by (service, topic) (increase(lab_dlq_records_total[5m])) > 0
        labels:
          component: business
          dashboard: lab-business
          severity: info
        annotations:
          description: Records from {{ $labels.topic }} could not be processed by {{ $labels.service }} and went to a dead-letter topic. Expected while the generator sends poison messages; otherwise inspect the DLQ in AKHQ.
          runbook_url: docs/runbooks/LabDeadLetterActivity.md
          summary: '{{ $labels.service }} dead-letters records from {{ $labels.topic }}'
      - alert: LabRevenueDrop
        expr: sum(rate(lab_revenue_cents_total[15m])) < 0.5 * sum(rate(lab_revenue_cents_total[15m] offset 1h))
        for: 2m
        labels:
          component: business
          dashboard: lab-business
          severity: warning
        annotations:
          description: Shipped order value per minute is less than 50 % of the same window an hour earlier. Something between order creation and shipping is broken or very slow — start at the funnel on the Commerce Business dashboard.
          runbook_url: docs/runbooks/LabRevenueDrop.md
          summary: Revenue dropped below half of the value one hour ago
      - alert: LabNotificationBacklog
        expr: sum by (kafka_cluster) (kminion_kafka_consumer_group_topic_lag{group_id="notification"}) > 1000
        for: 1m
        labels:
          component: business
          dashboard: kafka-lag
          severity: warning
        annotations:
          description: The notification consumer group lags behind by more than 1000 events on cluster {{ $labels.kafka_cluster }}. Orders ship, but customers hear about it late.
          runbook_url: docs/runbooks/LabNotificationBacklog.md
          summary: 'Customers are not notified: more than 1000 events wait for the notification service'
